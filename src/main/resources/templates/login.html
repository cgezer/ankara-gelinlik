<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Giriş</title>
</head>
<body>
<h2>Giriş</h2>
<form th:action="@{/login}" method="post">
    <label>Email:</label>
    <input type="text" name="email"/><br/>
    <label>Şifre:</label>
    <input type="password" name="password"/><br/>
    <button type="submit">Giriş</button>
    <div th:if="${param.error}">Hatalı kullanıcı adı veya şifre!</div>
    <div th:if="${param.logout}">Başarıyla çıkış yapıldı.</div>
</form>
</body>
</html>
