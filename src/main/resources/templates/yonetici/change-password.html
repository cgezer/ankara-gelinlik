<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Şifre Değiştir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm col-md-6 mx-auto">
        <div class="card-header bg-secondary text-white">
            <h4 class="mb-0">Şifre Değiştir</h4>
        </div>
        <div class="card-body">

            <form th:action="@{'/yonetici/change-password/' + ${yoneticiDTO.id}}" method="post" class="row g-3">
                <div class="col-12">
                    <label for="oldPassword" class="form-label">Eski Şifre</label>
                    <input type="password" id="oldPassword" name="oldPassword" class="form-control" required />
                </div>

                <div class="col-12">
                    <label for="newPassword" class="form-label">Yeni Şifre</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" required />
                </div>

                <div class="col-12 d-flex justify-content-between mt-3">
                    <a th:href="@{/yonetici/list}" class="btn btn-secondary">← Listeye Dön</a>
                    <button type="submit" class="btn btn-primary">🔑 Şifreyi Güncelle</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
