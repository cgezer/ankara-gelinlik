<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yeni Yönetici Ekle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h2>Yeni Yönetici Ekle</h2>
<form th:action="@{/yonetici/create}" th:object="${yonetici}" method="post">
    <div>
        <label for="ad">Ad:</label>
        <input type="text" id="ad" th:field="*{ad}" required>
    </div>
    <div>
        <label for="soyad">Soyad:</label>
        <input type="text" id="soyad" th:field="*{soyad}" required>
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required>
    </div>
    <div>
        <label for="sifre">Şifre:</label>
        <input type="password" id="sifre" th:field="*{sifre}" required>
    </div>
    <button type="submit">Kaydet</button>
</form>
<a th:href="@{/yonetici}">Geri</a>
</body>
</html>
