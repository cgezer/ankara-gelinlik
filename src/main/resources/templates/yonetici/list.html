<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Yöneticiler - Liste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .flash-hidden { opacity: 0; transition: opacity 0.5s ease; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <h3>Yönetici & Kullanıcı Yönetimi</h3>

        <div class="text-end">
            <a th:href="@{/yonetici/add}" class="btn btn-success me-2">Kullanıcı Ekle</a>
            <a href="javascript:history.back()" class="btn btn-secondary me-2">Geri</a>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-danger">Çıkış</button>
            </form>

            <!-- Tekil flash mesaj -->
            <div class="mt-2" id="flashContainer" style="max-width:400px; margin-left:auto;">
                <div th:if="${successMessage != null}" class="alert alert-success text-center shadow-sm" th:text="${successMessage}"></div>
                <div th:if="${errorMessage != null}" class="alert alert-danger text-center shadow-sm" th:text="${errorMessage}"></div>
            </div>
        </div>
    </div>

    <input type="hidden" id="highlightId" th:value="${highlightId}" />

    <!-- ADMIN TABLOSU -->
    <div class="card mb-4">
        <div class="card-header"><strong>Yöneticiler (ROLE_ADMIN)</strong></div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th><th>Ad</th><th>Soyad</th><th>Email</th><th>Rol</th><th>İşlemler</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="y : ${yoneticiler}" th:attr="data-id=${y.id}">
                        <td th:text="${y.id}"></td>
                        <td th:text="${y.ad}"></td>
                        <td th:text="${y.soyad}"></td>
                        <td th:text="${y.email}"></td>
                        <td th:text="${y.role}"></td>
                        <td>
                            <a th:href="@{'/yonetici/edit/' + ${y.id}}" class="btn btn-sm btn-primary me-1">Düzenle</a>
                            <a th:href="@{'/yonetici/change-password/' + ${y.id}}" class="btn btn-sm btn-warning me-1">Şifre Değiştir</a>
                            <a th:href="@{'/yonetici/delete/' + ${y.id}}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Bu yöneticiyi silmek istediğinize emin misiniz?');">Sil</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(yoneticiler)}">
                        <td colspan="6" class="text-center">Yönetici bulunamadı.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- USER TABLOSU -->
    <div class="card mb-4">
        <div class="card-header"><strong>Kullanıcılar (ROLE_USER)</strong></div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th><th>Ad</th><th>Soyad</th><th>Email</th><th>Rol</th><th>İşlemler</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${kullanicilar}" th:attr="data-id=${u.id}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.ad}"></td>
                        <td th:text="${u.soyad}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.role}"></td>
                        <td>
                            <a th:href="@{'/yonetici/edit-user/' + ${u.id}}" class="btn btn-sm btn-primary me-1">Düzenle</a>
                            <a th:href="@{'/yonetici/delete-user/' + ${u.id}}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?');">Sil</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(kullanicilar)}">
                        <td colspan="6" class="text-center">Kullanıcı bulunamadı.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // ✅ 10 saniye sonra flash mesajın kaybolması
        const flash = document.querySelector('#flashContainer .alert');
        if (flash) {
            setTimeout(() => {
                flash.style.transition = 'opacity 0.5s ease';
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 500);
            }, 10000);
        }

        // ✅ Yeni eklenen satırı 3 defa yanıp sönerek vurgulama
        const highlightInput = document.getElementById('highlightId');
        const highlightVal = highlightInput ? highlightInput.value : null;
        if (highlightVal && highlightVal.trim() !== '') {
            const row = document.querySelector('tr[data-id="' + highlightVal + '"]');
            if (row) {
                let toggles = 0;
                const maxToggles = 6;
                const interval = setInterval(() => {
                    row.classList.toggle('table-warning');
                    toggles++;
                    if (toggles >= maxToggles) {
                        clearInterval(interval);
                        row.classList.remove('table-warning');
                    }
                }, 1000);
            }
        }
    });
</script>

</body>
</html>
