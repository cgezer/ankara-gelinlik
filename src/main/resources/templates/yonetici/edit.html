<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yönetici Düzenle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h2>Yönetici Düzenle</h2>

<form th:action="@{/yonetici/edit/{id}(id=${yonetici.id})}" th:object="${yonetici}" method="post">

    <label for="ad">Ad:</label>
    <input type="text" id="ad" th:field="*{ad}" required>
    <br><br>

    <label for="soyad">Soyad:</label>
    <input type="text" id="soyad" th:field="*{soyad}" required>
    <br><br>

    <label for="email">E-posta:</label>
    <input type="email" id="email" th:field="*{email}" required>
    <br><br>

    <label for="sifre">Şifre (değiştirmek istemiyorsan boş bırak):</label>
    <input type="password" id="sifre" th:field="*{sifre}">
    <br><br>

    <button type="submit">Güncelle</button>
    <a th:href="@{/yonetici}">İptal</a>
</form>

</body>
</html>
