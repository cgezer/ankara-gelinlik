<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Şifre Değiştir - Kullanıcı</title></head>
<body>
<h2>Kullanıcı - Şifre Değiştir</h2>
<form th:action="@{/user/change-password}" th:object="${passwordForm}" method="post">
    <label>Mevcut Şifre</label>
    <input type="password" th:field="*{oldPassword}"/><br/>
    <label>Yeni Şifre</label>
    <input type="password" th:field="*{newPassword}"/><br/>
    <label>Yeni Şifre Tekrar</label>
    <input type="password" th:field="*{confirmPassword}"/><br/>
    <button type="submit">Değiştir</button>
</form>

<div th:if="${error}" th:text="${error}" style="color:red"></div>
<div th:if="${success}" th:text="${success}" style="color:green"></div>

<a th:href="@{/user/dashboard}">Geri</a>
</body>
</html>
