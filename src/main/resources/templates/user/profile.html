<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            width: 100%;
            max-width: 520px;
            padding: 35px;
            border-radius: 1rem;
            background-color: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-header i {
            font-size: 4rem;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        .profile-field {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            font-size: 1rem;
        }

        .profile-field i {
            color: #0d6efd;
            width: 28px;
            font-size: 1.2rem;
        }

        .profile-actions {
            margin-top: 25px;
        }

        .profile-actions a,
        .profile-actions button {
            width: 48%;
        }

        .fade-out {
            transition: opacity 0.6s ease-out;
        }
    </style>
</head>

<body>

<div class="profile-card">
    <div class="profile-header">
        <i class="bi bi-person-circle"></i>
        <h3>Profil Bilgilerim</h3>
    </div>

    <!-- Profil Alanları -->
    <div class="profile-field">
        <i class="bi bi-person"></i>
        <strong>Ad:</strong>&nbsp;<span th:text="${user.ad}">Ahmet</span>
    </div>

    <div class="profile-field">
        <i class="bi bi-person-lines-fill"></i>
        <strong>Soyad:</strong>&nbsp;<span th:text="${user.soyad}">Yılmaz</span>
    </div>

    <div class="profile-field">
        <i class="bi bi-envelope"></i>
        <strong>Email:</strong>&nbsp;<span th:text="${user.email}">ahmet@example.com</span>
    </div>

    <div class="profile-field">
        <i class="bi bi-shield-lock"></i>
        <strong>Rol:</strong>&nbsp;<span th:text="${user.role}">ROLE_USER</span>
    </div>

    <!-- Mesaj Alanları -->
    <div th:if="${successMessage}" class="alert alert-success text-center mt-3 fade-out" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger text-center mt-3 fade-out" th:text="${errorMessage}"></div>

    <!-- Aksiyon Butonları -->
    <div class="profile-actions d-flex justify-content-between mt-4">
        <a class="btn btn-primary" th:href="@{/user/change-password}">
            <i class="bi bi-key"></i> Şifre Değiştir
        </a>

        <form th:action="@{/logout}" method="post" class="d-inline w-100 text-end">
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Çıkış
            </button>
        </form>
    </div>

    <div class="text-center mt-3">
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Geri
        </a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Başarı / hata mesajlarını otomatik gizle
    document.addEventListener('DOMContentLoaded', () => {
        const alerts = document.querySelectorAll('.fade-out');
        alerts.forEach(alert => {
            setTimeout(() => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 600);
            }, 4000);
        });
    });
</script>

</body>
</html>
