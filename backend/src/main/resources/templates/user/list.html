<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Kullanıcılar</title>
</head>
<body>
<h2>Kullanıcılar</h2>

<!-- Geri Butonu -->
<a th:href="@{/user/list}">Geri</a>

<!-- Çıkış Butonu -->
<form th:action="@{/logout}" method="post" style="display:inline">
    <button type="submit">Çıkış</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Ad</th>
        <th>Soyad</th>
        <th>Email</th>
        <th>Role</th>
        <th>İşlemler</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.ad}"></td>
        <td th:text="${user.soyad}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.role}"></td>
        <td>
            <a th:href="@{/user/change-password}">Şifre Değiştir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
