<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Şifre Değiştir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background: #f8f9fa;
        }
        .card {
            border-radius: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .fade-out {
            transition: opacity 0.6s ease-out;
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="card-body">
                    <h3 class="text-center mb-4">🔒 Şifre Değiştir</h3>

                    <!-- Başarı Mesajı -->
                    <div th:if="${successMessage}" class="alert alert-success text-center fade-out" role="alert"
                         th:text="${successMessage}"></div>

                    <!-- Hata Mesajı -->
                    <div th:if="${errorMessage}" class="alert alert-danger text-center fade-out" role="alert"
                         th:text="${errorMessage}"></div>

                    <!-- Şifre Değiştirme Formu -->
                    <form th:action="@{/user/change-password}" method="post">
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">Eski Şifre</label>
                            <input type="password" class="form-control" id="oldPassword" name="oldPassword" required
                                   placeholder="Mevcut şifrenizi girin">
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Yeni Şifre</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required
                                   placeholder="Yeni şifrenizi girin">
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Şifreyi Güncelle</button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/user/profile}" class="btn btn-outline-secondary btn-sm">Profilime Dön</a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">Geri</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS: Başarı/hata mesajını 4 saniyede yavaşça kaybet -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const alerts = document.querySelectorAll('.fade-out');
        alerts.forEach(alert => {
            setTimeout(() => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 600);
            }, 4000);
        });
    });
</script>

</body>
</html>
