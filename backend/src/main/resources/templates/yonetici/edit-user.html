<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Kullanıcı Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-4">
    <h3>Kullanıcı Düzenle</h3>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{'/yonetici/edit-user/' + ${userDTO.id}}" th:object="${userDTO}" method="post">
        <div class="mb-3">
            <label class="form-label">Ad</label>
            <input type="text" class="form-control" th:field="*{ad}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Soyad</label>
            <input type="text" class="form-control" th:field="*{soyad}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Şifre</label>
            <input type="password" class="form-control" th:field="*{sifre}" required/>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Kaydet</button>
        </div>
    </form>

    <a th:href="@{/yonetici/list}" class="btn btn-secondary mt-3">Geri</a>
</div>
</body>
</html>
