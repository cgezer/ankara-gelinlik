<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yeni Yönetici Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Yeni Yönetici Ekle</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/yonetici/add}" th:object="${yoneticiDTO}" method="post" class="row g-3">

                <div class="col-md-6">
                    <label for="ad" class="form-label">Ad</label>
                    <input type="text" id="ad" class="form-control" th:field="*{ad}" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('ad')}" th:errors="*{ad}"></div>
                </div>

                <div class="col-md-6">
                    <label for="soyad" class="form-label">Soyad</label>
                    <input type="text" id="soyad" class="form-control" th:field="*{soyad}" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('soyad')}" th:errors="*{soyad}"></div>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">E-posta</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label for="sifre" class="form-label">Şifre</label>
                    <input type="password" id="sifre" class="form-control" th:field="*{sifre}" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('sifre')}" th:errors="*{sifre}"></div>
                </div>

                <div class="col-md-6">
                    <label for="role" class="form-label">Rol</label>
                    <select id="role" class="form-select" th:field="*{role}" required>
                        <option value="">Seçiniz</option>
                        <option value="ROLE_ADMIN">Yönetici</option>
                        <option value="ROLE_USER">Kullanıcı</option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>

                <div class="col-12 d-flex justify-content-between mt-3">
                    <a th:href="@{/yonetici/list}" class="btn btn-secondary">← Listeye Dön</a>
                    <button type="submit" class="btn btn-success">💾 Kaydet</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
