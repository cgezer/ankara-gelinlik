<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hata</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Modal stil ayarları */
        .modal {
            display: block; /* Modal her zaman açık */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 400px;
            text-align: center;
            border-radius: 8px;
        }

        .close-btn {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        .close-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="modal">
    <div class="modal-content">
        <h2>Hata!</h2>
        <p th:text="${message}">Beklenmedik bir hata oluştu.</p>
        <button class="close-btn" onclick="window.location.href='/login'">Giriş Sayfasına Dön</button>
    </div>
</div>

</body>
</html>
